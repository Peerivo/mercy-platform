name: One-time Mailpit e2e fix

on:
  push:
    branches:
      - feat/simple-auth-request-response
    paths:
      - .github/workflows/one-time-fix-mailpit-e2e.yml

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-auth-request-response
          fetch-depth: 0
      - name: Use Mailpit filtered latest-message endpoint
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/member.spec.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('async function getLatestMagicLink(email: string) {')
          end = text.index('async function register(page: Page, email: string) {', start)
          replacement = r'''async function getLatestMagicLink(email: string) {
            const query = encodeURIComponent(`to:"${email}"`);
            let link = "";
            await expect.poll(async () => {
              const response = await fetch(`http://127.0.0.1:54324/view/latest.html?query=${query}`);
              if (!response.ok) return "";
              const html = (await response.text()).replace(/&amp;/g, "&");
              const match = html.match(/http:\/\/127\.0\.0\.1:54321\/auth\/v1\/verify\?[^\s<>"']+/);
              link = match?.[0] ?? "";
              return link;
            }, { timeout: 15_000 }).not.toBe("");
            return link;
          }

          '''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          Path('.github/workflows/one-time-fix-mailpit-e2e.yml').unlink()
          PY
      - name: Commit fixed Mailpit fixture
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/member.spec.ts .github/workflows/one-time-fix-mailpit-e2e.yml
          git commit -m "test: read magic links from Mailpit"
          git push origin HEAD:feat/simple-auth-request-response
