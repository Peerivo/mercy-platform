name: Export Living Menaion runtime ciphertext

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-living-menaion-runtime-secret.yml"

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}

    steps:
      - name: Configure pinned SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Encrypt service role key on Beget
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ciphertext="$(ssh "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail

          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' supabase-db)"
          kong="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=kong")"
          test -n "$kong"

          service_key="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$kong" |
            awk -F= '$1 == "SUPABASE_SERVICE_KEY" || $1 == "SERVICE_ROLE_KEY" {sub(/^[^=]*=/, ""); print; exit}')"
          test -n "$service_key"

          pub="$(mktemp)"
          trap 'rm -f "$pub"; unset service_key' EXIT
          cat > "$pub" <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAyEGSWp0AJqIQciADarHa
          Qiy5L84uY2RcCkac+LRTAzk4rOQPkQNPy8RMo9BePlxq9EBnsV7lkZyCAhwSdcSK
          H5ViqnsVnkEYWovpx/oSuleUeIo9pVjPJ4ocitmTKhDQyRqxJb/u45V5Hini8Z3V
          OiXUw/qSHvVvtnIYeCQGG1q7bjAA4uRW7ccTgZLgLopCMayN+RwxJBJlQrYJgLJM
          WOM6P+PB03jByoiLxBuhRGGlOiM4dTdGMyfU6cxyjOPYilDcr3iStOQgm0db2w0s
          fObkhb+LqAoFIgfbXTBOl4WOzraYSzRy8H+IJ3TeceUQDfFescNK4MkHNB44Lnua
          JJ1wLBsr2h4J57ffnS26A7v13gPDiSQpZHtYH6rAAvtVqyaK8DyRS3OO8/1R17yp
          KyDSHShhCtidLs38gsFcr+v6jUR+gRGnd1xUK5bNCZpU5StbRns5qBmaUm2SFqKe
          DckFNTA/dTRsxqONjeIUpk99XZ02xhQFnqDnzYNuydFWlbda+iJ1pSAeWtdye6gx
          pe5lz2N+QCYhhij64sU+78ghyR8HdT9Wvvw4gKDo2NRBIZt+RgiGTi8C5NzwIlof
          OCmNlwz9oGwsHzphmI/WbYULoqKIJFwrOGj0hlyIM7EK28mNjziOZdezmykKy5Ma
          6LfZ/kZkdgtxRAQgS+WqUx8CAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^          //' "$pub"

          printf '%s' "$service_key" |
            openssl pkeyutl -encrypt -pubin -inkey "$pub"               -pkeyopt rsa_padding_mode:oaep               -pkeyopt rsa_oaep_md:sha256               -pkeyopt rsa_mgf1_md:sha256 |
            base64 -w0
          REMOTE
          )"

          test -n "$ciphertext"
          test "${#ciphertext}" -gt 500
          echo "::notice::MENAION_RUNTIME_SECRET_B64=$ciphertext"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
