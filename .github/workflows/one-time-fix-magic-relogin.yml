name: One-time magic relogin fix

on:
  push:
    branches:
      - feat/simple-auth-request-response
    paths:
      - .github/workflows/one-time-fix-magic-relogin.yml

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-auth-request-response
          fetch-depth: 0
      - name: Replace legacy password relogin
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/member.spec.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('    const login = p1.locator("form").filter({ hasText: "Войти" });')
          end = text.index('    await expect(p1).toHaveURL(/\\/cabinet$/);', start)
          end = text.index('\n', end) + 1
          replacement = '\n'.join([
            '    await p1.getByLabel("Email").fill(firstEmail);',
            '    await p1.getByRole("button", { name: "Получить ссылку для входа" }).click();',
            '    await expect(p1).toHaveURL(/\\/auth\\?sent=1/);',
            '    const reloginLink = await getLatestMagicLink(firstEmail);',
            '    await p1.goto(reloginLink);',
            '    await expect(p1).toHaveURL(/\\/cabinet$/);',
            '',
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          Path('.github/workflows/one-time-fix-magic-relogin.yml').unlink()
          PY
      - name: Commit fixed browser flow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/member.spec.ts .github/workflows/one-time-fix-magic-relogin.yml
          git commit -m "test: use magic link after Quick Exit"
          git push origin HEAD:feat/simple-auth-request-response
