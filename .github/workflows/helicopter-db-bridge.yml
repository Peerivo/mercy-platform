name: Grant Helicopter DB tunnel access

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helicopter-db-bridge.yml"

permissions:
  contents: read

concurrency:
  group: grant-helicopter-db-tunnel-beget
  cancel-in-progress: false

jobs:
  grant:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
      HELICOPTER_TUNNEL_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW helicopter-reg-ru1-to-beget"
      HELICOPTER_SOURCE_IP: "95.163.223.68"

    steps:
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS HELICOPTER_TUNNEL_PUBLIC_KEY HELICOPTER_SOURCE_IP; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: $name"; exit 1; }
          done
          [[ "$HELICOPTER_TUNNEL_PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+[[:space:]]helicopter-reg-ru1-to-beget$ ]]
          [[ "$HELICOPTER_SOURCE_IP" == "95.163.223.68" ]]

      - name: Configure pinned Beget SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify live Beget host key
        shell: bash
        run: |
          set -euo pipefail
          scan="$(mktemp)"
          trap 'rm -f "$scan"' EXIT
          ssh-keyscan -T 5 -t ed25519 "$BEGET_SUPABASE_HOST" 2>/dev/null > "$scan"
          test -s "$scan"
          scan_fp="$(ssh-keygen -lf "$scan" | awk 'NR==1 {print $2}')"
          test -n "$scan_fp"
          ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -Fx "$scan_fp" >/dev/null || {
            echo "::error::Live Beget host key does not match pinned known_hosts"
            exit 1
          }

      - name: Install restricted tunnel key
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          key_body="$(printf '%s\n' "$HELICOPTER_TUNNEL_PUBLIC_KEY" | awk '{print $2}')"
          restricted_line="from=\"$HELICOPTER_SOURCE_IP\",restrict,port-forwarding,permitopen=\"127.0.0.1:5432\",command=\"/bin/false\" $HELICOPTER_TUNNEL_PUBLIC_KEY"

          printf '%s\n%s\n' "$key_body" "$restricted_line" |             ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          IFS= read -r key_body
          IFS= read -r restricted_line
          test -n "$key_body"
          test -n "$restricted_line"

          umask 077
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$key_body" "$HOME/.ssh/authorized_keys" > "$tmp" || true
          printf '%s\n' "$restricted_line" >> "$tmp"
          cat "$tmp" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          test "$(grep -Fc "$key_body" "$HOME/.ssh/authorized_keys")" -eq 1
          grep -Fx "$restricted_line" "$HOME/.ssh/authorized_keys" >/dev/null
          REMOTE

      - name: Verify PostgreSQL remains loopback-only
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" '
            set -euo pipefail
            docker exec supabase-db psql -U supabase_admin -d postgres -X -qAt -c "select current_database();" | grep -qx postgres
          '
          echo "Restricted Helicopter tunnel key installed; PostgreSQL was not exposed publicly."

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
