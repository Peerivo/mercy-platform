name: Grant Helicopter DB tunnel access

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helicopter-db-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grant-helicopter-db-tunnel-beget
  cancel-in-progress: false

jobs:
  grant:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}

    steps:
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: $name"; exit 1; }
          done

      - name: Configure pinned Beget SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify Beget target before mutation
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          docker exec supabase-db psql -U supabase_admin -d postgres -X -qAt -v ON_ERROR_STOP=1             -c 'select current_database();' | grep -qx postgres
          ss -ltn | awk '{print $4}' | grep -qx '127.0.0.1:5432'
          ! ss -ltn | awk '{print $4}' | grep -Eq '^(0\.0\.0\.0|\[::\]):5432$'
          REMOTE

      - name: Install restricted Helicopter tunnel key
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail

          key_body='AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW'
          line='from="95.163.223.68",restrict,port-forwarding,permitopen="127.0.0.1:5432" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW helicopter-reg-ru1-to-beget'

          umask 077
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$key_body" "$HOME/.ssh/authorized_keys" > "$tmp" || true
          printf '%s\n' "$line" >> "$tmp"
          cat "$tmp" > "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"

          test "$(grep -Fc "$key_body" "$HOME/.ssh/authorized_keys")" -eq 1
          grep -Fx "$line" "$HOME/.ssh/authorized_keys" >/dev/null
          REMOTE

      - name: Report
        run: echo "Restricted Helicopter tunnel key installed on Beget."

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
