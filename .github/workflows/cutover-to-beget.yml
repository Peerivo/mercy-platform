name: Cut over Mercy Supabase to Beget

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Select RECOVER for failed-run backup only; MIGRATE requires separate fresh approval"
        required: true
        type: choice
        options:
          - CANCEL
          - RECOVER
          - MIGRATE
        default: CANCEL
      recover_from_run_id:
        description: "Optional failed/interrupted cutover run ID whose retained Beget safety backup must be restored before MIGRATE"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: mercy-beget-supabase-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ inputs.confirm == 'RECOVER' || inputs.confirm == 'MIGRATE' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIGRATION_CONFIRM: ${{ inputs.confirm }}
      RECOVER_FROM_RUN_ID: ${{ inputs.recover_from_run_id }}
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      OLD_SUPABASE_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}
      TARGET_SUPABASE_URL: https://api.xn----htbcggcjkhwxk7j6bn.xn--p1ai
      TARGET_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate production configuration
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "${MIGRATION_CONFIRM}" == "MIGRATE" || "${MIGRATION_CONFIRM}" == "RECOVER" ]]
          missing=0
          for name in \
            BEGET_SUPABASE_HOST \
            BEGET_SUPABASE_USER \
            BEGET_SUPABASE_SSH_KEY \
            BEGET_SUPABASE_KNOWN_HOSTS \
            OLD_SUPABASE_DB_URL \
            TARGET_ANON_KEY
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production configuration: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Validate requested failed/interrupted-run recovery
        if: ${{ inputs.recover_from_run_id != '' || inputs.confirm == 'RECOVER' }}
        shell: bash
        env:
          RECOVER_FROM_RUN_ID: ${{ inputs.recover_from_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${RECOVER_FROM_RUN_ID}" =~ ^[0-9]+$ ]] || {
            echo "::error::recover_from_run_id must be numeric"
            exit 1
          }

          run_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVER_FROM_RUN_ID}")"

          printf '%s' "${run_json}" | jq -e '
            .name == "Cut over Mercy Supabase to Beget" and
            .event == "workflow_dispatch" and
            (.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") and
            .head_branch == "main" and
            .path == ".github/workflows/cutover-to-beget.yml"
          ' >/dev/null || {
            echo "::error::Requested recovery id is not a failed/interrupted main-branch Mercy cutover run."
            exit 1
          }

          echo "RECOVERY_RUN_VERIFIED=1" >> "${GITHUB_ENV}"

      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${BEGET_SUPABASE_SSH_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${BEGET_SUPABASE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Syntax-check cutover script
        shell: bash
        run: bash -n scripts/cutover-beget.sh

      - name: Freeze, migrate and verify
        shell: bash
        run: bash scripts/cutover-beget.sh

      - name: Cutover result
        shell: bash
        run: |
          if [[ "${MIGRATION_CONFIRM}" == "RECOVER" ]]; then
            echo "Beget baseline recovery verified; no MIGRATE or source freeze executed."
          else
            echo "Mercy data is verified on Beget."
            echo "Old Mercy writes remain frozen until the REG.RU application cutover is verified."
          fi

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
