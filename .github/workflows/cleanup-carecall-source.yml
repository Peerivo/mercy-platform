name: One-time CareCall source cleanup

on:
  push:
    branches:
      - cleanup/remove-carecall
    paths:
      - .github/workflows/cleanup-carecall-source.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-carecall
          fetch-depth: 0
      - name: Remove obsolete specialist integration test and this temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/supabase.integration.test.ts')
          text = path.read_text(encoding='utf-8')
          start = '  test("specialist ownership, moderation, publication, search and documents enforce real API boundaries", async () => {'
          next_test = '  test("concurrent sends serialize the per-author quota while retry remains free", async () => {'
          i = text.index(start)
          j = text.index(next_test, i)
          path.write_text(text[:i] + text[j:], encoding='utf-8')
          Path('.github/workflows/cleanup-carecall-source.yml').unlink()
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/supabase.integration.test.ts .github/workflows/cleanup-carecall-source.yml
          git commit -m "test: remove specialist integration scenario"
          git push origin HEAD:cleanup/remove-carecall
