name: Expose Living Menaion REST

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/expose-living-menaion-rest.yml"

permissions:
  contents: read

concurrency:
  group: living-menaion-rest-frontdoor
  cancel-in-progress: false

jobs:
  expose:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}

    steps:
      - name: Configure pinned SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Persist and expose isolated Menaion route with rollback
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"

          ssh "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail

          caddy_name=supabase-caddy
          caddy_host_dir=/opt/beget/supabase/volumes/proxy/caddy
          test "$(docker inspect -f '{{.State.Running}}' "$caddy_name")" = "true"
          test "$(docker inspect -f '{{range $name,$cfg := .NetworkSettings.Networks}}{{if eq $name "supabase_default"}}yes{{end}}{{end}}' "$caddy_name")" = "yes"
          test "$(docker inspect -f '{{range $name,$cfg := .NetworkSettings.Networks}}{{if eq $name "supabase_default"}}yes{{end}}{{end}}' living-menaion-rest)" = "yes"

          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' supabase-db)"
          kong="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=kong")"
          test -n "$kong"

          service_key="$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$kong" |
            awk -F= '$1 == "SUPABASE_SERVICE_KEY" || $1 == "SERVICE_ROLE_KEY" {sub(/^[^=]*=/, ""); print; exit}')"
          test -n "$service_key"

          baseline_auth_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5             https://api.mercy.peerivo.net/auth/v1/health || true)"
          test -n "$baseline_auth_code"
          test "$baseline_auth_code" != "000"

          install -d -m 700 "$HOME/.living-menaion"
          caddyfile_backup="$(mktemp "$HOME/.living-menaion/Caddyfile.backup.XXXXXX")"
          caddyfile_candidate="$(mktemp "$HOME/.living-menaion/Caddyfile.candidate.XXXXXX")"
          probe_body="$(mktemp "$HOME/.living-menaion/menaion-probe.XXXXXX")"
          probe_headers="$(mktemp "$HOME/.living-menaion/menaion-headers.XXXXXX")"
          applied=0

          write_caddyfile() {
            docker run --rm -i --entrypoint sh               -v "$caddy_host_dir:/work"               caddy:2 -c 'cat > /work/Caddyfile' < "$1"
          }

          rollback() {
            if [ "$applied" -eq 1 ]; then
              write_caddyfile "$caddyfile_backup" || true
              docker exec "$caddy_name" caddy reload                 --config /etc/caddy/Caddyfile                 --adapter caddyfile >/dev/null 2>&1 || true
            fi
          }

          finish() {
            rc=$?
            trap - EXIT
            if [ "$rc" -ne 0 ]; then rollback; fi
            rm -f "$caddyfile_backup" "$caddyfile_candidate" "$probe_body" "$probe_headers"
            unset service_key
            exit "$rc"
          }
          trap finish EXIT

          docker exec "$caddy_name" cat /etc/caddy/Caddyfile > "$caddyfile_backup"
          cp "$caddyfile_backup" "$caddyfile_candidate"

          if ! grep -q 'handle_path /menaion/rest/v1/\*' "$caddyfile_candidate"; then
            python3 - "$caddyfile_candidate" <<'PY'
from pathlib import Path
import sys

path = Path(sys.argv[1])
text = path.read_text()
needle = "    @supabase_api path /auth/v1/* /rest/v1/* /graphql/v1 /realtime/v1/* /storage/v1/* /functions/v1/* /mcp /sso/*"
block = """    # Living Menaion isolated REST API
    handle_path /menaion/rest/v1/* {
        reverse_proxy living-menaion-rest:3000
    }

"""
if needle not in text:
    raise SystemExit("Supabase API matcher not found; refusing Caddy mutation")
path.write_text(text.replace(needle, block + needle, 1))
PY
          fi

          docker exec -i "$caddy_name" caddy adapt             --adapter caddyfile             --config /dev/stdin >/dev/null < "$caddyfile_candidate"

          write_caddyfile "$caddyfile_candidate"
          applied=1

          docker exec "$caddy_name" caddy reload             --config /etc/caddy/Caddyfile             --adapter caddyfile >/dev/null

          ok=0
          for _ in $(seq 1 20); do
            : > "$probe_body"
            : > "$probe_headers"
            menaion_code="$(curl -sS               -D "$probe_headers"               -o "$probe_body"               -w '%{http_code}'               --max-time 5               -H "Authorization: Bearer $service_key"               -H "apikey: $service_key"               -H "Accept-Profile: living_menaion"               "https://api.mercy.peerivo.net/menaion/rest/v1/liturgical_day_editions?select=id&limit=1" || true)"
            auth_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5               https://api.mercy.peerivo.net/auth/v1/health || true)"

            if [ "$menaion_code" = "200" ]               && [ "$auth_code" = "$baseline_auth_code" ]               && grep -Eq '^\[' "$probe_body"               && ! grep -Eqi '^www-authenticate:[[:space:]]*Basic' "$probe_headers"; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "Public Menaion REST verification failed; restoring previous Caddyfile." >&2
            exit 1
          fi

          docker exec "$caddy_name" cat /etc/caddy/Caddyfile             | grep -q 'handle_path /menaion/rest/v1/\*'

          applied=0
          echo "Living Menaion public REST route persisted and verified through public DNS."
          REMOTE

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
