name: Repair Beget Auth URLs

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact reviewed current main SHA"
        required: true
        type: string
      confirm:
        description: "Type REPAIR_AUTH_URLS"
        required: true
        type: string
  push:
    branches:
      - "test/auth-repair-workflow-*"

permissions:
  contents: read

concurrency:
  group: mercy-beget-auth-url-repair
  cancel-in-progress: false

env:
  TARGET_SITE_URL: https://mercy.peerivo.net
  TARGET_REDIRECT_URL: https://mercy.peerivo.net/auth/callback
  TARGET_API_EXTERNAL_URL: https://api.mercy.peerivo.net/auth/v1
  TARGET_SUPABASE_URL: https://api.mercy.peerivo.net

jobs:
  branch-test:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/test/auth-repair-workflow-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://mercy.peerivo.net
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-build-placeholder-key-123456789
    steps:
      - name: Checkout test branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate repair shell syntax
        shell: bash
        run: bash -n scripts/repair-beget-auth-urls-remote.sh scripts/verify-auth-callback-surface.sh

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Auth repair unit tests
        run: ./node_modules/.bin/vitest run tests/beget-auth-url-workflow.test.ts tests/auth-callback-route.test.ts

      - name: Build application with canonical site URL
        run: npm run build

      - name: Verify callback surface against local production build
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/mercy-auth-repair-test.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "${server_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/auth >/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "${ready}" = true || {
            cat /tmp/mercy-auth-repair-test.log
            exit 1
          }

          bash scripts/verify-auth-callback-surface.sh \
            "https://mercy.peerivo.net" \
            "http://127.0.0.1:3000"

  repair:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'REPAIR_AUTH_URLS' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      TARGET_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require exact reviewed current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.expected_sha }}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_sha must be a 40-character lowercase commit SHA"
            exit 1
          }
          test "${{ inputs.expected_sha }}" = "${GITHUB_SHA}" || {
            echo "::error::Dispatch SHA does not match the reviewed SHA"
            exit 1
          }
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "${GITHUB_SHA}" || {
            echo "::error::Dispatch revision is no longer current main"
            exit 1
          }

      - name: Validate protected production configuration
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            BEGET_SUPABASE_HOST \
            BEGET_SUPABASE_USER \
            BEGET_SUPABASE_SSH_KEY \
            BEGET_SUPABASE_KNOWN_HOSTS \
            TARGET_PUBLIC_KEY
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing production configuration: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${BEGET_SUPABASE_SSH_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${BEGET_SUPABASE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Repair only Auth URL configuration with rollback
        shell: bash
        run: |
          set -euo pipefail
          remote="${BEGET_SUPABASE_USER}@${BEGET_SUPABASE_HOST}"

          ssh "${remote}" bash -s -- \
            "${GITHUB_RUN_ID}" \
            "${TARGET_SITE_URL}" \
            "${TARGET_REDIRECT_URL}" \
            "${TARGET_API_EXTERNAL_URL}" \
            < scripts/repair-beget-auth-urls-remote.sh

      - name: Verify public Auth health and callback surface
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -H "apikey: ${TARGET_PUBLIC_KEY}" \
            "${TARGET_SUPABASE_URL}/auth/v1/health" >/dev/null

          settings="$(
            curl --fail --silent --show-error --max-time 15 \
              -H "apikey: ${TARGET_PUBLIC_KEY}" \
              "${TARGET_SUPABASE_URL}/auth/v1/settings"
          )"
          printf '%s' "${settings}" | jq -e 'type == "object"' >/dev/null

          bash scripts/verify-auth-callback-surface.sh "${TARGET_SITE_URL}"

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
