name: Grant Notify runner Beget access

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/grant-notify-runner-beget.yml"
      - ".peerivo/grant-notify-runner-beget.once"

permissions:
  contents: read
  issues: read

jobs:
  grant:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
      NOTIFY_RUNNER_KEY_ISSUE: "224"
      NOTIFY_RUNNER_KEY_FINGERPRINT: "SHA256:jCPRoQ/hISbpSycBkJ2ylRqRfKKvxWhmKtw7KpIvP3Y"

    steps:
      - name: Load fingerprint-pinned Notify runner public key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/notify-runner.pub"
          python3 - "$GITHUB_REPOSITORY" "$NOTIFY_RUNNER_KEY_ISSUE" "$GH_TOKEN" "$key_file" <<'PY'
          import json
          import sys
          import urllib.request

          repository, number, token, output = sys.argv[1:5]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/issues/{number}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              issue = json.load(response)

          if issue.get("title") != "[notify-runner-key] Peerivo Notify runner v2":
              raise SystemExit("Unexpected Notify runner key issue title")
          key = str(issue.get("body") or "").strip()
          if "\n" in key or not key.startswith("ssh-ed25519 "):
              raise SystemExit("Notify runner key issue has invalid format")
          with open(output, "w", encoding="utf-8") as handle:
              handle.write(key + "\n")
          PY

          fingerprint="$(ssh-keygen -lf "$key_file" | awk 'NR==1 {print $2}')"
          test "$fingerprint" = "$NOTIFY_RUNNER_KEY_FINGERPRINT" || {
            echo "::error::Notify runner public key fingerprint mismatch"
            exit 1
          }
          key="$(cat "$key_file")"
          printf 'NOTIFY_RUNNER_PUBLIC_KEY=%s\n' "$key" >> "$GITHUB_ENV"
          echo "Notify runner public key fingerprint verified."

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS NOTIFY_RUNNER_PUBLIC_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: $name"; exit 1; }
          done
          [[ "$NOTIFY_RUNNER_PUBLIC_KEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+[[:space:]]peerivo-notify-runner-v2$ ]]

      - name: Configure pinned SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify live host key matches pinned host
        shell: bash
        run: |
          set -euo pipefail
          scan="$(mktemp)"
          trap 'rm -f "$scan"' EXIT
          ssh-keyscan -T 5 -t ed25519 "$BEGET_SUPABASE_HOST" 2>/dev/null > "$scan"
          test -s "$scan"
          scan_fp="$(ssh-keygen -lf "$scan" | awk 'NR==1 {print $2}')"
          test -n "$scan_fp"
          ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}' | grep -Fx "$scan_fp" >/dev/null || {
            echo "::error::Live Beget host key does not match pinned known_hosts"
            exit 1
          }
          echo "PINNED_BEGET_HOST_FINGERPRINT=$scan_fp"

      - name: Authorize Notify runner public key
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$remote" \
            "bash -s -- '$NOTIFY_RUNNER_PUBLIC_KEY'" <<'REMOTE'
          set -euo pipefail
          key="$1"
          test -n "$key"
          umask 077
          mkdir -p "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/authorized_keys"
          if ! grep -Fxq "$key" "$HOME/.ssh/authorized_keys"; then
            printf '%s\n' "$key" >> "$HOME/.ssh/authorized_keys"
          fi
          grep -Fxq "$key" "$HOME/.ssh/authorized_keys"
          REMOTE
          echo "Notify runner public key authorized."

      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
