name: Preflight Mercy Supabase migration to Beget

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercy-beget-supabase-preflight
  cancel-in-progress: false

jobs:
  preflight:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      OLD_SUPABASE_DB_URL: ${{ secrets.OLD_SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required production configuration
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=0
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS OLD_SUPABASE_DB_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing production configuration: ${name}"
              missing=1
            fi
          done
          test "${missing}" -eq 0

      - name: Configure pinned SSH host key
        shell: bash
        env:
          BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${BEGET_SUPABASE_SSH_KEY}" > ~/.ssh/id_ed25519
          printf '%s\n' "${BEGET_SUPABASE_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Parse source connection without exposing password in argv
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          value = os.environ["OLD_SUPABASE_DB_URL"]
          u = urlparse(value)
          if u.scheme not in {"postgres", "postgresql"}:
              raise SystemExit("OLD_SUPABASE_DB_URL must be a postgres URI")
          if not all([u.hostname, u.username, u.path]):
              raise SystemExit("OLD_SUPABASE_DB_URL is missing host/user/database")
          password = unquote(u.password or "")
          if not password:
              raise SystemExit("OLD_SUPABASE_DB_URL must contain the database password")

          env = {
              "PGHOST": u.hostname,
              "PGPORT": str(u.port or 5432),
              "PGUSER": unquote(u.username),
              "PGPASSWORD": password,
              "PGDATABASE": unquote(u.path.lstrip("/")),
              "PGSSLMODE": "require",
          }
          out = Path("/tmp/source-pg.env")
          out.write_text("".join(f"{k}={v}\n" for k, v in env.items()))
          out.chmod(0o600)
          PY

      - name: Inspect source database
        id: source
        shell: bash
        run: |
          set -euo pipefail
          query="select current_setting('server_version'), (select count(*) from auth.users), (select count(*) from public.help_requests), (select count(*) from public.volunteer_offers), (select count(*) from pg_tables where schemaname='public'), (select count(*) from pg_policies where schemaname='public');"
          result="$(docker run --rm --env-file /tmp/source-pg.env postgres:17-alpine psql -At -F '|' -c "${query}")"
          IFS='|' read -r pg users help offers tables policies <<< "${result}"
          printf 'Source PostgreSQL: %s\n' "${pg}"
          printf 'Source auth.users: %s\n' "${users}"
          printf 'Source public.help_requests: %s\n' "${help}"
          printf 'Source public.volunteer_offers: %s\n' "${offers}"
          printf 'Source public tables: %s\n' "${tables}"
          printf 'Source public policies: %s\n' "${policies}"
          {
            echo "pg=${pg}"
            echo "users=${users}"
            echo "help=${help}"
            echo "offers=${offers}"
            echo "tables=${tables}"
            echo "policies=${policies}"
          } >> "$GITHUB_OUTPUT"

      - name: Inspect Beget target and require a fresh Mercy target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          remote="${BEGET_SUPABASE_USER}@${BEGET_SUPABASE_HOST}"
          result="$(ssh "${remote}" "docker exec supabase-db psql -U postgres -d postgres -At -F '|' -c \"select current_setting('server_version'), (select count(*) from auth.users), coalesce(to_regclass('public.help_requests')::text,''), (select count(*) from pg_tables where schemaname='public'), (select count(*) from pg_policies where schemaname='public'), (select count(*) from storage.buckets), (select count(*) from storage.objects);\"")"
          IFS='|' read -r pg users help_relation tables policies buckets objects <<< "${result}"
          printf 'Target PostgreSQL: %s\n' "${pg}"
          printf 'Target auth.users: %s\n' "${users}"
          printf 'Target Mercy help_requests relation: %s\n' "${help_relation:-absent}"
          printf 'Target public tables: %s\n' "${tables}"
          printf 'Target public policies: %s\n' "${policies}"
          printf 'Target Storage buckets: %s\n' "${buckets}"
          printf 'Target Storage objects: %s\n' "${objects}"

          if [ "${users}" != "0" ] || [ -n "${help_relation}" ] || [ "${buckets}" != "0" ] || [ "${objects}" != "0" ]; then
            echo "::error::Beget target is not fresh for Mercy; preflight refuses to proceed."
            exit 1
          fi
          echo "pg=${pg}" >> "$GITHUB_OUTPUT"

      - name: Verify required extensions are available on target
        shell: bash
        run: |
          set -euo pipefail
          remote="${BEGET_SUPABASE_USER}@${BEGET_SUPABASE_HOST}"

          source_ext="$(docker run --rm --env-file /tmp/source-pg.env postgres:17-alpine psql -At -c "select extname from pg_extension where extname in ('postgis','pgcrypto','uuid-ossp') order by 1;")"
          target_available="$(ssh "${remote}" "docker exec supabase-db psql -U postgres -d postgres -At -c \"select name from pg_available_extensions where name in ('postgis','pgcrypto','uuid-ossp') order by 1;\"")"
          target_installed="$(ssh "${remote}" "docker exec supabase-db psql -U postgres -d postgres -At -c \"select extname from pg_extension where extname in ('postgis','pgcrypto','uuid-ossp') order by 1;\"")"

          printf 'Required source extensions:\n%s\n' "${source_ext}"
          printf 'Available target extensions:\n%s\n' "${target_available}"
          printf 'Already installed target extensions:\n%s\n' "${target_installed}"

          test "${source_ext}" = "${target_available}"

          if ! printf '%s\n' "${target_installed}" | grep -qx postgis; then
            echo "PostGIS is available but not yet installed on the fresh target."
            echo "This is expected: Mercy's initial migration installs PostGIS in schema extensions."
          fi

      - name: Report compatibility result
        shell: bash
        run: |
          set -euo pipefail
          echo "Preflight passed."
          echo "No source data was dumped and the Beget database was not modified."
          echo "Source PostgreSQL: ${{ steps.source.outputs.pg }}"
          echo "Target PostgreSQL: ${{ steps.target.outputs.pg }}"
          echo "The destructive migration/cutover remains a separate reviewed increment and must include a source write-freeze plus rollback."

      - name: Remove sensitive runner files
        if: always()
        shell: bash
        run: |
          rm -f ~/.ssh/id_ed25519 /tmp/source-pg.env
