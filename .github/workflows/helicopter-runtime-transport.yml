name: Configure Helicopter Notify Beget bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helicopter-runtime-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helicopter-notify-beget-bridge
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
      HELICOPTER_TENANT_ID: c21db6b6-c544-4ae7-b00a-8ba416b85a92

    steps:
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS HELICOPTER_TENANT_ID; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: $name"; exit 1; }
          done
          test "$BEGET_SUPABASE_HOST" = "45.144.176.213"
          [[ "$BEGET_SUPABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]

      - name: Configure pinned Beget SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install loopback-only Helicopter Notify bridge
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote"             "if [ \"\$(id -u)\" -eq 0 ]; then exec bash -s -- '$BEGET_SUPABASE_USER' '$HELICOPTER_TENANT_ID'; else exec sudo -n bash -s -- '$BEGET_SUPABASE_USER' '$HELICOPTER_TENANT_ID'; fi" <<'REMOTE'
          set -euo pipefail
          bridge_user="$1"
          tenant_id="$2"

          [[ "$bridge_user" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$tenant_id" =~ ^[0-9a-f-]{36}$ ]]

          notify_env=/etc/peerivo-notify/notify.env
          test -r "$notify_env"
          grep -q '^NOTIFY_CORE_TOKEN=.' "$notify_env"

          cat > /usr/local/bin/peerivo-helicopter-notify-bridge.py <<'PY'
          #!/usr/bin/env python3
          import http.client
          import json
          import os
          import re
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          TENANT_ID = os.environ["HELICOPTER_TENANT_ID"].strip()
          CORE_TOKEN = os.environ["NOTIFY_CORE_TOKEN"].strip()
          BRIDGE_TOKEN = "helicopter-ssh-bridge-v1"
          MAX_BODY = 128 * 1024

          def allowed(method, path):
              if method == "POST" and path in ("/v1/notify", "/v1/human-actions"):
                  return True
              return method == "GET" and re.fullmatch(r"/v1/human-actions/[A-Za-z0-9_-]{10,64}", path) is not None

          class Handler(BaseHTTPRequestHandler):
              server_version = "peerivo-helicopter-notify-bridge/1"

              def log_message(self, fmt, *args):
                  return

              def handle_request(self):
                  path = self.path.split("?", 1)[0]
                  if self.headers.get("Authorization", "") != "Bearer " + BRIDGE_TOKEN:
                      self.send_response(401)
                      self.end_headers()
                      return
                  if not allowed(self.command, path):
                      self.send_response(404)
                      self.end_headers()
                      return

                  body = b""
                  if self.command == "POST":
                      try:
                          size = int(self.headers.get("Content-Length", "0"))
                      except ValueError:
                          size = -1
                      if size < 0 or size > MAX_BODY:
                          self.send_response(413)
                          self.end_headers()
                          return
                      body = self.rfile.read(size)

                  conn = http.client.HTTPConnection("127.0.0.1", 3000, timeout=12)
                  headers = {
                      "Authorization": "Bearer " + CORE_TOKEN,
                      "X-Notify-Tenant-Id": TENANT_ID,
                      "Accept": "application/json",
                  }
                  if self.command == "POST":
                      headers["Content-Type"] = "application/json"

                  try:
                      conn.request(self.command, path, body=body if self.command == "POST" else None, headers=headers)
                      response = conn.getresponse()
                      payload = response.read()
                      self.send_response(response.status)
                      self.send_header("Content-Type", response.getheader("Content-Type") or "application/json")
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(payload)
                  except Exception:
                      self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"ok": False, "error": "notify_bridge_upstream_failed"}).encode())
                  finally:
                      conn.close()

              do_GET = handle_request
              do_POST = handle_request

          ThreadingHTTPServer(("127.0.0.1", 3301), Handler).serve_forever()
          PY

          chmod 755 /usr/local/bin/peerivo-helicopter-notify-bridge.py
          chown root:root /usr/local/bin/peerivo-helicopter-notify-bridge.py

          install -d -m 700 /etc/peerivo-notify
          cat > /etc/peerivo-notify/helicopter-bridge.env <<EOF
          HELICOPTER_TENANT_ID=$tenant_id
          EOF
          sed -i 's/^          //' /etc/peerivo-notify/helicopter-bridge.env
          chmod 600 /etc/peerivo-notify/helicopter-bridge.env

          cat > /etc/systemd/system/peerivo-helicopter-notify-bridge.service <<'UNIT'
          [Unit]
          Description=Peerivo Helicopter tenant Notify bridge
          After=network-online.target peerivo-notify.service
          Wants=network-online.target
          Requires=peerivo-notify.service

          [Service]
          Type=simple
          User=peerivo-notify
          Group=peerivo-notify
          EnvironmentFile=/etc/peerivo-notify/notify.env
          EnvironmentFile=/etc/peerivo-notify/helicopter-bridge.env
          ExecStart=/usr/bin/python3 /usr/local/bin/peerivo-helicopter-notify-bridge.py
          Restart=always
          RestartSec=3
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          ProtectSystem=strict
          ProtectHome=true
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX

          [Install]
          WantedBy=multi-user.target
          UNIT
          sed -i 's/^          //' /etc/systemd/system/peerivo-helicopter-notify-bridge.service

          bridge_home="$(getent passwd "$bridge_user" | cut -d: -f6)"
          bridge_group="$(id -gn "$bridge_user")"
          test -n "$bridge_home"

          auth="$bridge_home/.ssh/authorized_keys"
          install -d -m 700 -o "$bridge_user" -g "$bridge_group" "$bridge_home/.ssh"
          touch "$auth"
          chown "$bridge_user:$bridge_group" "$auth"
          chmod 600 "$auth"

          key_body='AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW'
          line='from="95.163.223.68",restrict,port-forwarding,permitopen="127.0.0.1:5432",permitopen="127.0.0.1:3301",command="/bin/false" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW helicopter-reg-ru1-to-beget'

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$key_body" "$auth" > "$tmp" || true
          printf '%s\n' "$line" >> "$tmp"
          cat "$tmp" > "$auth"
          chown "$bridge_user:$bridge_group" "$auth"
          chmod 600 "$auth"
          test "$(grep -Fc "$key_body" "$auth")" -eq 1
          grep -Fx "$line" "$auth" >/dev/null

          systemctl daemon-reload
          systemctl enable --now peerivo-helicopter-notify-bridge.service

          ok=0
          for _ in $(seq 1 20); do
            if systemctl is-active --quiet peerivo-helicopter-notify-bridge.service               && ss -ltnH '( sport = :3301 )' | awk '{print $4}' | grep -Fx '127.0.0.1:3301' >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done
          test "$ok" = "1"

          status="$(curl -sS -o /dev/null -w '%{http_code}'             -H 'Authorization: Bearer wrong'             http://127.0.0.1:3301/v1/human-actions/not-a-real-id)"
          test "$status" = "401"

          echo "HELICOPTER_NOTIFY_BEGET_BRIDGE=ready"
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
