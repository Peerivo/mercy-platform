name: Configure Helicopter Notify Beget bridge

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/helicopter-runtime-transport.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helicopter-notify-beget-bridge
  cancel-in-progress: false

jobs:
  configure:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
      HELICOPTER_TENANT_ID: c21db6b6-c544-4ae7-b00a-8ba416b85a92

    steps:
      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in BEGET_SUPABASE_HOST BEGET_SUPABASE_USER BEGET_SUPABASE_SSH_KEY BEGET_SUPABASE_KNOWN_HOSTS HELICOPTER_TENANT_ID; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: $name"; exit 1; }
          done
          test "$BEGET_SUPABASE_HOST" = "45.144.176.213"
          [[ "$BEGET_SUPABASE_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]

      - name: Configure pinned Beget SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Install loopback-only bridge container
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" "bash -s -- '$HELICOPTER_TENANT_ID'" <<'REMOTE'
          set -euo pipefail
          tenant_id="$1"
          [[ "$tenant_id" =~ ^[0-9a-f-]{36}$ ]]

          command -v docker >/dev/null
          docker ps >/dev/null

          home_dir="$HOME"
          work_dir="$home_dir/.peerivo/helicopter-notify-bridge"
          script="$work_dir/bridge.py"
          auth="$home_dir/.ssh/authorized_keys"

          umask 077
          mkdir -p "$work_dir" "$home_dir/.ssh"
          test -e /etc/peerivo-notify/notify.env

          cat > "$script" <<'PY'
          import http.client
          import json
          import os
          import re
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          BRIDGE_TOKEN = "helicopter-ssh-bridge-v1"
          TENANT_ID = os.environ["HELICOPTER_TENANT_ID"].strip()
          MAX_BODY = 128 * 1024

          def read_core_token():
              env = {}
              with open("/run/notify.env", "r", encoding="utf-8") as handle:
                  for raw in handle:
                      line = raw.strip()
                      if not line or line.startswith("#") or "=" not in line:
                          continue
                      key, value = line.split("=", 1)
                      env[key.strip()] = value.strip().strip('"').strip("'")
              token = env.get("NOTIFY_CORE_TOKEN", "")
              if len(token) < 32:
                  raise RuntimeError("NOTIFY_CORE_TOKEN unavailable")
              return token

          CORE_TOKEN = read_core_token()

          def allowed(method, path):
              if method == "POST" and path in ("/v1/notify", "/v1/human-actions"):
                  return True
              return method == "GET" and re.fullmatch(r"/v1/human-actions/[A-Za-z0-9_-]{10,64}", path) is not None

          class Handler(BaseHTTPRequestHandler):
              server_version = "peerivo-helicopter-notify-bridge/1"

              def log_message(self, fmt, *args):
                  return

              def handle_request(self):
                  path = self.path.split("?", 1)[0]
                  if self.headers.get("Authorization", "") != "Bearer " + BRIDGE_TOKEN:
                      self.send_response(401)
                      self.end_headers()
                      return
                  if not allowed(self.command, path):
                      self.send_response(404)
                      self.end_headers()
                      return

                  body = b""
                  if self.command == "POST":
                      try:
                          size = int(self.headers.get("Content-Length", "0"))
                      except ValueError:
                          size = -1
                      if size < 0 or size > MAX_BODY:
                          self.send_response(413)
                          self.end_headers()
                          return
                      body = self.rfile.read(size)

                  conn = http.client.HTTPConnection("127.0.0.1", 3000, timeout=12)
                  headers = {
                      "Authorization": "Bearer " + CORE_TOKEN,
                      "X-Notify-Tenant-Id": TENANT_ID,
                      "Accept": "application/json",
                  }
                  if self.command == "POST":
                      headers["Content-Type"] = "application/json"

                  try:
                      conn.request(self.command, path, body=body if self.command == "POST" else None, headers=headers)
                      response = conn.getresponse()
                      payload = response.read()
                      self.send_response(response.status)
                      self.send_header("Content-Type", response.getheader("Content-Type") or "application/json")
                      self.send_header("Cache-Control", "no-store")
                      self.end_headers()
                      self.wfile.write(payload)
                  except Exception:
                      self.send_response(502)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps({"ok": False, "error": "notify_bridge_upstream_failed"}).encode())
                  finally:
                      conn.close()

              do_GET = handle_request
              do_POST = handle_request

          ThreadingHTTPServer(("127.0.0.1", 3301), Handler).serve_forever()
          PY
          chmod 600 "$script"

          touch "$auth"
          chmod 600 "$auth"
          key_body='AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW'
          line='from="95.163.223.68",restrict,port-forwarding,permitopen="127.0.0.1:5432",permitopen="127.0.0.1:3301",command="/bin/false" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQgI40S1Fa2LCVhirCi9D47O2Rdl6ERuCTl+Zg0NPUW helicopter-reg-ru1-to-beget'

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$key_body" "$auth" > "$tmp" || true
          printf '%s\n' "$line" >> "$tmp"
          cat "$tmp" > "$auth"
          chmod 600 "$auth"
          test "$(grep -Fc "$key_body" "$auth")" -eq 1
          grep -Fx "$line" "$auth" >/dev/null

          docker rm -f peerivo-helicopter-notify-bridge >/dev/null 2>&1 || true
          docker run -d             --name peerivo-helicopter-notify-bridge             --restart unless-stopped             --network host             --read-only             --cap-drop ALL             --security-opt no-new-privileges:true             --tmpfs /tmp:rw,noexec,nosuid,size=16m             -e "HELICOPTER_TENANT_ID=$tenant_id"             -v /etc/peerivo-notify/notify.env:/run/notify.env:ro             -v "$script":/app/bridge.py:ro             python:3.13-alpine             python /app/bridge.py >/dev/null

          ok=0
          for _ in $(seq 1 30); do
            if docker ps --filter name=^/peerivo-helicopter-notify-bridge$ --format '{{.Status}}' | grep -q '^Up '               && ss -ltnH '( sport = :3301 )' | awk '{print $4}' | grep -Fx '127.0.0.1:3301' >/dev/null; then
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            docker logs --tail=100 peerivo-helicopter-notify-bridge || true
            exit 1
          fi

          status="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:3301/v1/human-actions/not-a-real-id)"
          test "$status" = "401"

          echo "HELICOPTER_NOTIFY_BEGET_BRIDGE=ready"
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
