name: Finalize Sarafanka on REG.RU

on:
  push:
    branches:
      - ops/sarafanka-reg1-finalize-20261006
    paths:
      - ".github/workflows/finalize-sarafanka-reg1.yml"

permissions:
  contents: read

jobs:
  finalize:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REG_RU_HOST: ${{ vars.REG_RU_HOST || secrets.REG_RU_HOST }}
      REG_RU_USER: ${{ vars.REG_RU_USER || secrets.REG_RU_USER }}
      REG_RU_KNOWN_HOSTS: ${{ vars.REG_RU_KNOWN_HOSTS }}
      REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}

    steps:
      - name: Validate REG.RU root transport
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in REG_RU_HOST REG_RU_USER REG_RU_KNOWN_HOSTS REG_RU_SSH_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing $name"; exit 1; }
          done
          test "$REG_RU_HOST" = "95.163.223.68"
          test "$REG_RU_USER" = "root"

      - name: Configure pinned REG.RU SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$REG_RU_SSH_KEY" > ~/.ssh/reg_ru
          printf '%s\n' "$REG_RU_KNOWN_HOSTS" > ~/.ssh/reg_known_hosts
          chmod 600 ~/.ssh/reg_ru ~/.ssh/reg_known_hosts
          ssh-keygen -y -P '' -f ~/.ssh/reg_ru >/dev/null
          ssh-keygen -F "$REG_RU_HOST" -f ~/.ssh/reg_known_hosts >/dev/null

      - name: Install persistent root-owned Beget tunnels
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-F /dev/null -i ~/.ssh/reg_ru -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/reg_known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail

          deploy_home=/var/lib/sarafanka-deploy
          key="$deploy_home/.ssh/sarafanka_beget_tunnel"
          known="$deploy_home/.ssh/beget_sarafanka_known_hosts"
          candidate_in=/opt/peerivo/sarafanka/incoming/runtime.db.candidate.env

          test -s "$key"
          test -s "$known"
          test -s "$candidate_in"

          gateway="$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')"
          test "$gateway" = "172.17.0.1"

          # Retire all experimental tunnel services before taking their ports.
          systemctl disable --now peerivo-sarafanka-beget-tunnel.service >/dev/null 2>&1 || true

          if [ -S /run/user/594/bus ]; then
            env XDG_RUNTIME_DIR=/run/user/594 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/594/bus               runuser -u sarafanka-deploy -- systemctl --user disable --now                 sarafanka-beget-db-tunnel.service sarafanka-beget-storage-tunnel.service                 sarafanka-beget-tunnel.service >/dev/null 2>&1 || true
          fi

          # Ensure no old per-user tunnel still owns the target ports.
          pkill -u 594 -f 'sarafanka_beget_tunnel.*(55435|58003)' >/dev/null 2>&1 || true
          for _ in $(seq 1 10); do
            if ! ss -ltnH '( sport = :55435 or sport = :58003 )' | grep -q .; then break; fi
            sleep 1
          done
          ! ss -ltnH '( sport = :55435 )' | grep -q .
          ! ss -ltnH '( sport = :58003 )' | grep -q .

          cat > /etc/systemd/system/peerivo-sarafanka-beget-db-tunnel.service <<EOF
          [Unit]
          Description=Peerivo Sarafanka DB tunnel to isolated Beget Supabase
          After=network-online.target docker.service
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/ssh -NT -F /dev/null -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o GlobalKnownHostsFile=/dev/null -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L $gateway:55435:127.0.0.1:55432 sarafanka-tunnel@45.144.176.213
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > /etc/systemd/system/peerivo-sarafanka-beget-storage-tunnel.service <<EOF
          [Unit]
          Description=Peerivo Sarafanka Storage tunnel to isolated Beget Supabase
          After=network-online.target docker.service
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/ssh -NT -F /dev/null -i $key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known -o GlobalKnownHostsFile=/dev/null -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -L 127.0.0.1:58003:127.0.0.1:58000 sarafanka-tunnel@45.144.176.213
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          sed -i 's/^          //'             /etc/systemd/system/peerivo-sarafanka-beget-db-tunnel.service             /etc/systemd/system/peerivo-sarafanka-beget-storage-tunnel.service

          systemctl daemon-reload
          systemctl enable --now peerivo-sarafanka-beget-db-tunnel.service
          systemctl enable --now peerivo-sarafanka-beget-storage-tunnel.service

          db_ok=0
          storage_ok=0
          for _ in $(seq 1 20); do
            systemctl is-active --quiet peerivo-sarafanka-beget-db-tunnel.service &&               ss -ltnH '( sport = :55435 )' | awk '{print $4}' | grep -Fx "$gateway:55435" >/dev/null && db_ok=1 || true
            systemctl is-active --quiet peerivo-sarafanka-beget-storage-tunnel.service &&               ss -ltnH '( sport = :58003 )' | awk '{print $4}' | grep -Fx '127.0.0.1:58003' >/dev/null && storage_ok=1 || true
            [ "$db_ok" = 1 ] && [ "$storage_ok" = 1 ] && break
            sleep 1
          done

          echo "DB_TUNNEL=$db_ok STORAGE_TUNNEL=$storage_ok"
          if [ "$db_ok" != 1 ] || [ "$storage_ok" != 1 ]; then
            systemctl --no-pager --full status peerivo-sarafanka-beget-db-tunnel.service || true
            systemctl --no-pager --full status peerivo-sarafanka-beget-storage-tunnel.service || true
            journalctl --no-pager -u peerivo-sarafanka-beget-db-tunnel.service -n 40 || true
            journalctl --no-pager -u peerivo-sarafanka-beget-storage-tunnel.service -n 40 || true
            exit 1
          fi

          docker run --rm --add-host=host.docker.internal:host-gateway postgres:17-alpine             pg_isready -h host.docker.internal -p 55435 -d sarafanka >/dev/null

          test "$(curl -fsS --max-time 5 http://127.0.0.1:58003/)" = "Sarafanka Supabase"
          echo 'ROOT_TUNNELS_OK'
          REMOTE

      - name: Build root-owned runtime candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-F /dev/null -i ~/.ssh/reg_ru -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/reg_known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set +x
          set +v
          set -Eeuo pipefail
          umask 077

          current=/opt/peerivo/sarafanka/shared/runtime.env
          incoming=/opt/peerivo/sarafanka/incoming/runtime.db.candidate.env
          candidate=/opt/peerivo/sarafanka/shared/runtime.candidate.env

          test -s "$current"
          test -s "$incoming"

          # Candidate staged by the non-root deployment path contains the app DB role and secret key.
          for key in DATABASE_URL DIRECT_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SECRET_KEY; do
            test "$(grep -c "^$key=" "$incoming")" = 1
          done

          grep -Ev '^(DATABASE_URL|DIRECT_URL|NEXT_PUBLIC_SUPABASE_URL|SUPABASE_SECRET_KEY)=' "$current" > "$candidate"

          grep '^DATABASE_URL=' "$incoming" >> "$candidate"
          grep '^DIRECT_URL=' "$incoming" >> "$candidate"
          printf 'NEXT_PUBLIC_SUPABASE_URL=https://sarafan.peerivo.net/supabase\n' >> "$candidate"
          grep '^SUPABASE_SECRET_KEY=' "$incoming" >> "$candidate"

          chown root:root "$candidate"
          chmod 600 "$candidate"

          dburl="$(sed -n 's/^DATABASE_URL=//p' "$candidate")"
          test -n "$dburl"
          case "$dburl" in
            *'@172.17.0.1:55435/sarafanka?sslmode=disable') ;;
            *) echo 'Unexpected DB candidate target' >&2; exit 1 ;;
          esac

          echo '=== CANDIDATE KEYS ==='
          cut -d= -f1 "$candidate" | sort
          echo 'ROOT_RUNTIME_CANDIDATE_OK'
          REMOTE

      - name: Validate candidate container and auth
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-F /dev/null -i ~/.ssh/reg_ru -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/reg_known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          candidate=/opt/peerivo/sarafanka/shared/runtime.candidate.env
          image="$(docker inspect -f '{{.Config.Image}}' sarafanka)"
          test -n "$image"

          docker rm -f sarafanka-candidate >/dev/null 2>&1 || true
          docker run -d             --name sarafanka-candidate             --env-file "$candidate"             --publish 127.0.0.1:3401:3000             --memory 512m             --pids-limit 256             --cap-drop ALL             --security-opt no-new-privileges             "$image" >/dev/null

          cleanup() { docker rm -f sarafanka-candidate >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3401/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

          auth="$(curl -fsS --max-time 10 http://127.0.0.1:3401/api/auth/status)"
          echo "$auth"
          printf '%s' "$auth" | grep -q '"applicationReady":true'
          printf '%s' "$auth" | grep -q '"identityReady":true'
          printf '%s' "$auth" | grep -q '"password":true'
          printf '%s' "$auth" | grep -q '"google":true'
          printf '%s' "$auth" | grep -q '"googleConfigured":true'

          code="$(curl -sS -o /tmp/sarafanka-prepare.json -w '%{http_code}' --max-time 10             -X POST             -H 'Origin: https://sarafan.peerivo.net'             -H 'Content-Type: application/json'             --data '{"next":"/"}'             http://127.0.0.1:3401/api/auth/prepare)"
          test "$code" = 200
          grep -q '"action":"https://auth.peerivo.net/' /tmp/sarafanka-prepare.json
          rm -f /tmp/sarafanka-prepare.json

          echo 'SARAFANKA_CANDIDATE_AUTH_OK'
          REMOTE

      - name: Publish same-origin Supabase API through existing Sarafanka Nginx
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-F /dev/null -i ~/.ssh/reg_ru -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/reg_known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          conf=/etc/nginx/bx/site_ext_enabled/sarafan.peerivo.net.conf
          backup="/root/sarafan-nginx-before-supabase-$(date +%Y%m%d-%H%M%S).conf"
          cp -a "$conf" "$backup"

          cat > "$conf" <<'EOF'
          server {
              listen 80;
              server_name sarafan.peerivo.net;

              include bx/conf/letsencrypt-challenge-tokens.conf;

              location / {
                  return 308 https://sarafan.peerivo.net$request_uri;
              }
          }

          server {
              listen 443 ssl;
              http2 on;

              server_name sarafan.peerivo.net;

              ssl_certificate     /home/bitrix/dehydrated/certs/sarafan.peerivo.net/fullchain.pem;
              ssl_certificate_key /home/bitrix/dehydrated/certs/sarafan.peerivo.net/privkey.pem;
              ssl_trusted_certificate /home/bitrix/dehydrated/certs/sarafan.peerivo.net/chain.pem;

              access_log /var/log/nginx/sarafan.peerivo.net.access.log;
              error_log  /var/log/nginx/sarafan.peerivo.net.error.log;

              location ^~ /supabase/ {
                  proxy_pass http://127.0.0.1:58003/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Host $host;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_set_header X-Forwarded-Prefix /supabase;
                  proxy_connect_timeout 5s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
                  proxy_request_buffering off;
                  client_max_body_size 12m;
              }

              location / {
                  proxy_pass http://127.0.0.1:3400;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_connect_timeout 5s;
                  proxy_send_timeout 60s;
                  proxy_read_timeout 60s;
              }
          }
          EOF
          sed -i 's/^          //' "$conf"

          if ! nginx -t; then
            cp -a "$backup" "$conf"
            nginx -t
            nginx -s reload
            exit 1
          fi
          nginx -s reload
          sleep 2

          test "$(curl -fsS --max-time 10 https://sarafan.peerivo.net/supabase/)" = "Sarafanka Supabase"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://sarafan.peerivo.net/supabase/storage/v1/status)" = 200

          echo 'SARAFANKA_SUPABASE_PROXY_OK'
          REMOTE

      - name: Promote candidate to production with rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          opts=(-F /dev/null -i ~/.ssh/reg_ru -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/reg_known_hosts -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=10)
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh "${opts[@]}" "$remote" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          base=/opt/peerivo/sarafanka/shared
          current="$base/runtime.env"
          candidate="$base/runtime.candidate.env"
          ts="$(date +%Y%m%d-%H%M%S)"
          env_backup="$base/runtime.env.before-db-$ts"
          rollback="sarafanka-rollback-$ts"
          image="$(docker inspect -f '{{.Config.Image}}' sarafanka)"

          test -s "$candidate"
          cp -a "$current" "$env_backup"
          docker rm -f sarafanka-candidate >/dev/null 2>&1 || true

          docker stop sarafanka >/dev/null
          docker rename sarafanka "$rollback"
          cp -a "$candidate" "$current"
          chmod 600 "$current"

          rollback_all() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker rm -f sarafanka >/dev/null 2>&1 || true
              cp -a "$env_backup" "$current"
              if docker inspect "$rollback" >/dev/null 2>&1; then
                docker rename "$rollback" sarafanka
                docker start sarafanka >/dev/null
              fi
            fi
            exit "$rc"
          }
          trap rollback_all EXIT

          docker run -d             --name sarafanka             --restart unless-stopped             --env-file "$current"             --publish 127.0.0.1:3400:3000             --memory 512m             --pids-limit 256             --cap-drop ALL             --security-opt no-new-privileges             "$image" >/dev/null

          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:3400/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

          auth="$(curl -fsS --max-time 10 https://sarafan.peerivo.net/api/auth/status)"
          echo "$auth"
          printf '%s' "$auth" | grep -q '"applicationReady":true'
          printf '%s' "$auth" | grep -q '"identityReady":true'
          printf '%s' "$auth" | grep -q '"password":true'
          printf '%s' "$auth" | grep -q '"google":true'
          printf '%s' "$auth" | grep -q '"googleConfigured":true'

          code="$(curl -sS -o /tmp/public-prepare.json -w '%{http_code}' --max-time 10             -X POST             -H 'Origin: https://sarafan.peerivo.net'             -H 'Content-Type: application/json'             --data '{"next":"/"}'             https://sarafan.peerivo.net/api/auth/prepare)"
          test "$code" = 200
          grep -q '"action":"https://auth.peerivo.net/' /tmp/public-prepare.json
          rm -f /tmp/public-prepare.json

          key="$(sed -n 's/^SUPABASE_SECRET_KEY=//p' "$current")"
          test -n "$key"
          bucket_code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10             -H "Authorization: Bearer $key"             -H "apikey: $key"             https://sarafan.peerivo.net/supabase/storage/v1/bucket/documents)"
          unset key
          test "$bucket_code" = 200

          test "$(docker inspect -f '{{.State.Health.Status}}' sarafanka)" = healthy
          test "$(systemctl is-active peerivo-sarafanka-beget-db-tunnel.service)" = active
          test "$(systemctl is-active peerivo-sarafanka-beget-storage-tunnel.service)" = active

          rm -f "$candidate"
          trap - EXIT

          echo 'SARAFANKA_PRODUCTION_DB_AUTH_STORAGE_OK'
          echo "ROLLBACK_CONTAINER=$rollback"
          echo "ENV_BACKUP=$env_backup"
          REMOTE

      - name: Cleanup runner
        if: always()
        shell: bash
        run: rm -f ~/.ssh/reg_ru ~/.ssh/reg_known_hosts
