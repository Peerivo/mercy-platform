name: One-time response e2e update

on:
  push:
    branches:
      - feat/simple-auth-request-response
    paths:
      - .github/workflows/one-time-response-e2e.yml

permissions:
  contents: write

jobs:
  update-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simple-auth-request-response
          fetch-depth: 0
      - name: Add direct response browser assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/member.spec.ts')
          text = path.read_text(encoding='utf-8')
          needle = '''    await expect(\n      p2.getByText("A fictional browser request")\n    ).toBeVisible();\n'''
          addition = needle + '''    await p2.getByLabel("Чем вы можете помочь").fill("Могу привезти продукты сегодня вечером");\n    await p2.getByLabel("Как с вами связаться").fill("Telegram @browser-helper");\n    await p2.getByLabel(/Я согласен.*сообщение/).check();\n    await p2.getByRole("button", { name: "Отправить отклик" }).click();\n    await expect(p2.getByText(/Отклик отправлен/)).toBeVisible();\n'''
          if needle not in text:
            raise SystemExit('target snippet not found')
          path.write_text(text.replace(needle, addition, 1), encoding='utf-8')
          Path('.github/workflows/one-time-response-e2e.yml').unlink()
          PY
      - name: Commit browser response coverage
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/e2e/member.spec.ts .github/workflows/one-time-response-e2e.yml
          git commit -m "test: cover direct request response UI"
          git push origin HEAD:feat/simple-auth-request-response
