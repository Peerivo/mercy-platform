name: Inspect Living Menaion Docker front door
# Reinspect after route repair: 2026-09-30

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-living-menaion-docker-frontdoor.yml"

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BEGET_SUPABASE_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
      BEGET_SUPABASE_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
      BEGET_SUPABASE_SSH_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
      BEGET_SUPABASE_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}

    steps:
      - name: Configure pinned SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$BEGET_SUPABASE_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$BEGET_SUPABASE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Inspect Docker front door without secret values
        shell: bash
        run: |
          set -euo pipefail
          remote="$BEGET_SUPABASE_USER@$BEGET_SUPABASE_HOST"
          ssh "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "published_ports_begin"
          docker ps --format '{{.Names}}|{{.Image}}|{{.Ports}}' | while IFS='|' read -r name image ports; do
            if [[ "$ports" == *"0.0.0.0:80->"* || "$ports" == *"0.0.0.0:443->"* || "$ports" == *":::80->"* || "$ports" == *":::443->"* ]]; then
              printf '%s|%s|%s\n' "$name" "$image" "$ports"
            fi
          done
          echo "published_ports_end"

          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' supabase-db)"
          kong="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=kong")"
          test -n "$kong"

          echo "kong_network_mode=$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$kong")"
          echo "kong_mounts_begin"
          docker inspect -f '{{range .Mounts}}{{println .Type "|" .Source "|" .Destination "|" .RW}}{{end}}' "$kong"
          echo "kong_mounts_end"

          echo "kong_env_names_begin"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$kong" | sed 's/=.*$/=REDACTED/' | sort
          echo "kong_env_names_end"

          echo "menaion_rest_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' living-menaion-rest)"

          echo "host_network_containers_begin"
          for cid in $(docker ps -q); do
            mode="$(docker inspect -f '{{.HostConfig.NetworkMode}}' "$cid")"
            if [ "$mode" = "host" ]; then
              docker inspect -f '{{.Name}}|{{.Config.Image}}|{{.HostConfig.NetworkMode}}' "$cid"
            fi
          done
          echo "host_network_containers_end"

          echo "listener_processes_begin"
          command -v fuser >/dev/null 2>&1 && (fuser -v 80/tcp 443/tcp 2>&1 || true)
          command -v lsof >/dev/null 2>&1 && (lsof -nP -iTCP:80 -iTCP:443 -sTCP:LISTEN 2>/dev/null || true)
          echo "listener_processes_end"

          echo "https_local_headers_begin"
          curl -ksS -D - -o /dev/null --max-time 5 https://127.0.0.1/ | sed -n '1,20p' || true
          echo "https_local_headers_end"

          echo "certificate_subject_begin"
          timeout 5 openssl s_client -connect 127.0.0.1:443 -servername api.mercy.peerivo.net </dev/null 2>/dev/null |
            openssl x509 -noout -subject -issuer -ext subjectAltName 2>/dev/null || true
          echo "certificate_subject_end"

          caddy_cid="$(docker ps -q --filter "name=^/supabase-caddy$")"
          test -n "$caddy_cid"
          echo "caddy_image=$(docker inspect -f '{{.Config.Image}}' "$caddy_cid")"
          echo "caddy_started_at=$(docker inspect -f '{{.State.StartedAt}}' "$caddy_cid")"
          echo "caddy_restart_count=$(docker inspect -f '{{.RestartCount}}' "$caddy_cid")"
          echo "caddy_path=$(docker inspect -f '{{.Path}}' "$caddy_cid")"
          echo "caddy_args=$(docker inspect -f '{{json .Args}}' "$caddy_cid")"
          echo "caddy_labels_begin"
          docker inspect -f '{{range $k,$v := .Config.Labels}}{{println $k "=" $v}}{{end}}' "$caddy_cid" | sort
          echo "caddy_labels_end"
          echo "caddy_host_dir_listing_begin"
          docker run --rm -v /opt/beget/supabase/volumes/proxy/caddy:/work:ro alpine:3.22 sh -c 'find /work -maxdepth 2 -type f -printf "%p|%s|%TY-%Tm-%TdT%TH:%TM:%TSZ\n" 2>/dev/null | sort'
          echo "caddy_host_dir_listing_end"
          echo "caddyfile_stat_begin"
          docker exec "$caddy_cid" stat -c '%i|%s|%y|%n' /etc/caddy/Caddyfile || true
          echo "caddyfile_stat_end"
          echo "caddy_mounts_begin"
          docker inspect -f '{{range .Mounts}}{{println .Type "|" .Source "|" .Destination "|" .RW}}{{end}}' "$caddy_cid"
          echo "caddy_mounts_end"
          echo "caddy_env_names_begin"
          docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$caddy_cid" | sed 's/=.*$/=REDACTED/' | sort
          echo "caddy_env_names_end"
          echo "caddy_networks=$(docker inspect -f '{{range $name,$cfg := .NetworkSettings.Networks}}{{printf "%s " $name}}{{end}}' "$caddy_cid")"
          echo "caddy_started_at=$(docker inspect -f '{{.State.StartedAt}}' "$caddy_cid")"
          echo "menaion_route_persisted=$(docker exec "$caddy_cid" sh -c 'grep -q "handle_path /menaion/rest/v1/\\*" /etc/caddy/Caddyfile && echo yes || echo no')"
          echo "menaion_live_route_count=$(docker run --rm --network "container:$caddy_name" curlimages/curl:8.14.1 -fsS http://127.0.0.1:2019/config/apps/http/servers/srv0/routes | jq '[.. | objects | select(.dial? == "living-menaion-rest:3000")] | length')"
          external_headers="$(mktemp)"
          external_code="$(curl -sS -D "$external_headers" -o /dev/null -w '%{http_code}' --max-time 5 https://api.mercy.peerivo.net/menaion/rest/v1/sources?select=id\\&limit=1 || true)"
          echo "menaion_external_http=$external_code"
          if grep -Eqi '^www-authenticate:[[:space:]]*Basic' "$external_headers"; then
            echo "menaion_external_basic_auth=yes"
          else
            echo "menaion_external_basic_auth=no"
          fi
          rm -f "$external_headers"
          echo "menaion_networks=$(docker inspect -f '{{range $name,$cfg := .NetworkSettings.Networks}}{{printf "%s " $name}}{{end}}' living-menaion-rest)"
          echo "caddyfile_host_readable=$(test -r /opt/beget/supabase/volumes/proxy/caddy/Caddyfile && echo yes || echo no)"
          echo "caddyfile_host_writable=$(test -w /opt/beget/supabase/volumes/proxy/caddy/Caddyfile && echo yes || echo no)"
          echo "home_living_menaion_writable=$(test -w "$HOME/.living-menaion" && echo yes || echo no)"

          project="$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' supabase-db)"
          kong_cid2="$(docker ps -q --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=kong")"
          service_key_present=no
          if [ -n "$kong_cid2" ]; then
            if docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$kong_cid2" | grep -Eq '^(SUPABASE_SERVICE_KEY|SERVICE_ROLE_KEY)=.+'; then
              service_key_present=yes
            fi
          fi
          echo "service_key_present=$service_key_present"

          auth_probe="$(mktemp)"
          auth_code="$(curl -sS -o "$auth_probe" -w '%{http_code}' --max-time 5 --resolve api.mercy.peerivo.net:443:127.0.0.1 https://api.mercy.peerivo.net/auth/v1/health || true)"
          echo "auth_probe_http=$auth_code"
          echo "auth_probe_bytes=$(wc -c < "$auth_probe" | tr -d ' ')"
          rm -f "$auth_probe"
          for candidate in /etc/caddy/Caddyfile /config/Caddyfile /Caddyfile; do
            if docker exec "$caddy_cid" test -f "$candidate"; then
              echo "caddyfile_path=$candidate"
              echo "caddyfile_begin"
              docker exec "$caddy_cid" cat "$candidate"
              echo "caddyfile_end"
            fi
          done
          REMOTE

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519
