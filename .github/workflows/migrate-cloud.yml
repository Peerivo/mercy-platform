name: Migrate selected Supabase
on:
  workflow_dispatch:
    inputs:
      project_ref: {description: 'Exact target project ref', required: true, type: string}
      confirm: {description: 'Type APPLY', required: true, type: string}
concurrency: {group: "supabase-${{ inputs.project_ref }}", cancel-in-progress: false}
jobs:
  migrate:
    if: inputs.confirm == 'APPLY'
    environment: supabase-${{ inputs.project_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: {version: 2.39.2}
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env: {PROJECT_REF: "${{ inputs.project_ref }}", SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
      - run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
        env: {SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}", SUPABASE_DB_PASSWORD: "${{ secrets.SUPABASE_DB_PASSWORD }}"}
      - name: Remove obsolete qualification documents bucket
        shell: bash
        env:
          PROJECT_REF: "${{ inputs.project_ref }}"
          SUPABASE_ACCESS_TOKEN: "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
        run: |
          set -euo pipefail

          keys_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true")"

          server_key="$(printf '%s' "$keys_json" | jq -r '
            ([.[] | select(.type == "secret") | .api_key]
             + [.[] | select(.name == "service_role") | .api_key])
            | .[0] // empty
          ')"

          test -n "$server_key" || {
            echo "No secret/service_role key available for Storage API cleanup" >&2
            exit 1
          }

          bucket_url="https://${PROJECT_REF}.supabase.co/storage/v1/bucket/qualification-documents"
          status="$(curl --silent --show-error --output /tmp/mercy-bucket.json --write-out '%{http_code}' \
            -H "apikey: ${server_key}" \
            -H "Authorization: Bearer ${server_key}" \
            "$bucket_url")"

          api_code="$(jq -r '.code // empty' /tmp/mercy-bucket.json 2>/dev/null || true)"
          api_status="$(jq -r '.statusCode // empty' /tmp/mercy-bucket.json 2>/dev/null || true)"

          if [ "$status" = "404" ] || [ "$api_code" = "NoSuchBucket" ] || [ "$api_status" = "404" ]; then
            echo "qualification-documents bucket is already absent"
            exit 0
          fi

          if [ "$status" != "200" ]; then
            cat /tmp/mercy-bucket.json >&2 || true
            echo "Unexpected Storage API status while checking bucket: ${status}" >&2
            exit 1
          fi

          delete_status="$(curl --silent --show-error --output /tmp/mercy-bucket-delete.json --write-out '%{http_code}' \
            -X DELETE \
            -H "apikey: ${server_key}" \
            -H "Authorization: Bearer ${server_key}" \
            "$bucket_url")"

          delete_code="$(jq -r '.code // empty' /tmp/mercy-bucket-delete.json 2>/dev/null || true)"
          delete_api_status="$(jq -r '.statusCode // empty' /tmp/mercy-bucket-delete.json 2>/dev/null || true)"

          if [[ "$delete_status" =~ ^2 ]]; then
            echo "qualification-documents bucket removed through Storage API"
            exit 0
          fi

          if [ "$delete_status" = "404" ] || [ "$delete_code" = "NoSuchBucket" ] || [ "$delete_api_status" = "404" ]; then
            echo "qualification-documents bucket became absent during cleanup"
            exit 0
          fi

          cat /tmp/mercy-bucket-delete.json >&2 || true
          echo "Unexpected Storage API status while deleting bucket: ${delete_status}" >&2
          exit 1
