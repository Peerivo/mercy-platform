name: Inspect hosts for isolated Living Menaion

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-menaion-hosts.yml'
      - 'scripts/inspect-menaion-host.py'
      - 'tests/test_inspect_menaion_host.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA with successful project CI
        required: true
        type: string
      confirm:
        description: Type INSPECT_MENAION_HOSTS (read-only; no deployment)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mercy-menaion-host-inspection
  cancel-in-progress: false

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_inspect_menaion_host.py'

  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'INSPECT_MENAION_HOSTS' }}
    needs: safety-tests
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact current main and successful project CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${EXPECTED_SHA}" = "${GITHUB_SHA}"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_main}" = "${EXPECTED_SHA}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${EXPECTED_SHA}&event=push&per_page=1" \
            | jq -e --arg sha "${EXPECTED_SHA}" '.workflow_runs[0] | .head_sha == $sha and .head_branch == "main" and .status == "completed" and .conclusion == "success"' >/dev/null

      - name: Inspect existing hosts without mutation
        env:
          BEGET_HOST: ${{ vars.BEGET_SUPABASE_HOST || secrets.BEGET_SUPABASE_HOST }}
          BEGET_USER: ${{ vars.BEGET_SUPABASE_USER || secrets.BEGET_SUPABASE_USER }}
          BEGET_KEY: ${{ secrets.BEGET_SUPABASE_SSH_KEY }}
          BEGET_KNOWN_HOSTS: ${{ secrets.BEGET_SUPABASE_KNOWN_HOSTS }}
          REG_RU_HOST: ${{ vars.REG_RU_HOST || secrets.REG_RU_HOST }}
          REG_RU_USER: ${{ vars.REG_RU_USER || secrets.REG_RU_USER }}
          REG_RU_KEY: ${{ secrets.REG_RU_SSH_KEY }}
          REG_RU_KNOWN_HOSTS: ${{ vars.REG_RU_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "${ssh_dir}"' EXIT
          for name in BEGET_HOST BEGET_USER BEGET_KEY BEGET_KNOWN_HOSTS REG_RU_HOST REG_RU_USER REG_RU_KEY REG_RU_KNOWN_HOSTS; do
            test -n "${!name:-}" || { echo "::error::Missing protected configuration: ${name}"; exit 1; }
          done
          inspect_host() {
            local role="$1" host="$2" user="$3" key="$4" known="$5"
            [[ "${host}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
            [[ "${user}" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
            [[ "${role}" == beget || "${role}" == reg-ru ]]
            printf '%s\n' "${key}" > "${ssh_dir}/${role}.key"
            printf '%s\n' "${known}" > "${ssh_dir}/${role}.known_hosts"
            # No remote files, service restarts, schema writes, or configuration changes.
            # Fixed script and role are streamed; errors never print credentials.
            ssh -F /dev/null -i "${ssh_dir}/${role}.key" \
              -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              -o "UserKnownHostsFile=${ssh_dir}/${role}.known_hosts" \
              "${user}@${host}" "python3 - '${role}'" < scripts/inspect-menaion-host.py
          }
          inspect_host beget "${BEGET_HOST}" "${BEGET_USER}" "${BEGET_KEY}" "${BEGET_KNOWN_HOSTS}"
          inspect_host reg-ru "${REG_RU_HOST}" "${REG_RU_USER}" "${REG_RU_KEY}" "${REG_RU_KNOWN_HOSTS}"
