name: Repair Helicopter REG.RU Actions key

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-helicopter-regru-actions-key.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    if: ${{ github.repository == 'Peerivo/mercy-platform' && github.ref == 'refs/heads/main' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REG_RU_HOST: ${{ vars.REG_RU_HOST || secrets.REG_RU_HOST }}
      REG_RU_USER: ${{ vars.REG_RU_USER || secrets.REG_RU_USER }}
      REG_RU_KNOWN_HOSTS: ${{ vars.REG_RU_KNOWN_HOSTS }}

    steps:
      - name: Validate protected configuration
        env:
          REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in REG_RU_HOST REG_RU_USER REG_RU_KNOWN_HOSTS REG_RU_SSH_KEY; do
            test -n "${!name:-}" || { echo "::error::Missing production configuration: $name"; exit 1; }
          done
          test "$REG_RU_HOST" = "95.163.223.68"
          test "$REG_RU_USER" = "root"

      - name: Configure pinned REG.RU SSH
        env:
          REG_RU_SSH_KEY: ${{ secrets.REG_RU_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$REG_RU_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$REG_RU_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Dedicated key exists and is valid
        shell: bash
        run: |
          set -euo pipefail
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" '
            set -euo pipefail
            test -s /root/.ssh/helicopter_github_actions
            chmod 600 /root/.ssh/helicopter_github_actions
            ssh-keygen -y -f /root/.ssh/helicopter_github_actions >/dev/null
          '

      - name: Dedicated key is authorized exactly once
        shell: bash
        run: |
          set -euo pipefail
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" 'bash -s' <<'REMOTE'
          set -euo pipefail
          key=/root/.ssh/helicopter_github_actions
          auth=/root/.ssh/authorized_keys
          derived="$(ssh-keygen -y -f "$key")"
          body="$(printf '%s\n' "$derived" | awk '{print $2}')"

          umask 077
          mkdir -p /root/.ssh
          touch "$auth"
          chmod 700 /root/.ssh
          chmod 600 "$auth"

          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          grep -Fv "$body" "$auth" > "$tmp" || true
          printf '%s peerivo-helicopter-github-actions\n' "$derived" >> "$tmp"
          cat "$tmp" > "$auth"
          chmod 600 "$auth"

          test "$(grep -Fc "$body" "$auth")" -eq 1
          REMOTE

      - name: sshd accepts root public-key login
        shell: bash
        run: |
          set -euo pipefail
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" '
            set -euo pipefail
            sshd_bin="$(command -v sshd || printf /usr/sbin/sshd)"
            test -x "$sshd_bin"
            pubkey="$("$sshd_bin" -T | awk '''$1=="pubkeyauthentication"{print $2; exit}''')"
            root_login="$("$sshd_bin" -T | awk '''$1=="permitrootlogin"{print $2; exit}''')"
            test "$pubkey" = "yes"
            test "$root_login" != "no"
          '

      - name: Dedicated key authenticates locally
        shell: bash
        run: |
          set -euo pipefail
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" '
            set -euo pipefail
            ssh               -i /root/.ssh/helicopter_github_actions               -o IdentitiesOnly=yes               -o BatchMode=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               -o ConnectTimeout=5               root@127.0.0.1               "printf HELICOPTER_LOCAL_KEY_OK"
          ' | grep -qx HELICOPTER_LOCAL_KEY_OK

      - name: Dedicated key authenticates through public REG.RU address
        shell: bash
        run: |
          set -euo pipefail
          remote="$REG_RU_USER@$REG_RU_HOST"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$remote" '
            set -euo pipefail
            ssh               -i /root/.ssh/helicopter_github_actions               -o IdentitiesOnly=yes               -o BatchMode=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               -o ConnectTimeout=7               root@95.163.223.68               "printf HELICOPTER_PUBLIC_KEY_OK"
          ' | grep -qx HELICOPTER_PUBLIC_KEY_OK

      - name: Remove runner SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
